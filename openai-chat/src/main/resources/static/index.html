<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galaxy AI Chatbot</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #030014;
            color: white;
        }

        /* GALAXY BACKGROUND */

        .galaxy {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;

            background:
                radial-gradient(ellipse at 20% 30%, #32105f 0%, transparent 45%),
                radial-gradient(ellipse at 80% 70%, #071b55 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, #16072e 0%, #030014 80%);
        }

        .nebula {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: float 15s infinite alternate ease-in-out;
        }

        .nebula.one {
            background: #8b2cff;
            top: -250px;
            left: -200px;
        }

        .nebula.two {
            background: #0066ff;
            bottom: -300px;
            right: -200px;
            animation-delay: 3s;
        }

        .nebula.three {
            background: #d000ff;
            top: 35%;
            left: 40%;
            width: 350px;
            height: 350px;
            opacity: 0.15;
            animation-delay: 5s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(100px, 80px) scale(1.3);
            }
        }

        #stars {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* MAIN CHAT CONTAINER */

        .main {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;

            background: rgba(12, 10, 35, 0.65);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 25px;

            backdrop-filter: blur(25px);

            box-shadow:
                0 0 50px rgba(105, 40, 255, 0.15),
                inset 0 0 30px rgba(255, 255, 255, 0.02);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* HEADER */

        .header {
            padding: 22px 25px;

            display: flex;
            align-items: center;
            gap: 15px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

            background: rgba(255, 255, 255, 0.03);
        }

        .logo {
            width: 48px;
            height: 48px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            background: linear-gradient(135deg, #8b5cf6, #2563eb);

            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .header h2 {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            color: #5cffb1;
        }

        .status::before {
            content: "";
            display: inline-block;

            width: 7px;
            height: 7px;

            background: #5cffb1;
            border-radius: 50%;

            margin-right: 7px;

            box-shadow: 0 0 10px #5cffb1;
        }

        /* CHAT AREA */

        .chat-area {
            flex: 1;
            padding: 25px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-area::-webkit-scrollbar {
            width: 5px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #7545ce;
            border-radius: 10px;
        }

        .welcome {
            text-align: center;
            margin: auto;
            padding: 20px;
        }

        .welcome .emoji {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 10px;

            background: linear-gradient(90deg, #fff, #b69aff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .welcome p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
        }

        /* MESSAGE BUBBLES */

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;

            animation: appear 0.3s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bot {
            align-self: flex-start;
        }

        .avatar {
            min-width: 35px;
            height: 35px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #8b5cf6, #2563eb);

            font-size: 17px;
        }

        .user .avatar {
            background: linear-gradient(135deg, #2563eb, #06b6d4);
        }

        .bubble {
            padding: 13px 17px;

            border-radius: 16px;

            font-size: 14px;
            line-height: 1.6;

            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .bot .bubble {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-left-radius: 3px;
        }

        .user .bubble {
            background: linear-gradient(135deg, #7545e8, #4267d5);
            border-top-right-radius: 3px;
        }

        /* TYPING ANIMATION */

        .typing {
            display: flex;
            gap: 5px;
            padding: 8px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;

            background: #b69aff;
            border-radius: 50%;

            animation: bounce 0.7s infinite alternate;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            to {
                transform: translateY(-7px);
                opacity: 0.4;
            }
        }

        /* INPUT AREA */

        .input-area {
            padding: 20px 25px 15px;

            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 8px 10px 8px 20px;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 18px;

            transition: 0.3s;
        }

        .input-box:focus-within {
            border-color: #9b6cff;

            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        input {
            flex: 1;

            background: transparent;
            border: none;
            outline: none;

            color: white;
            font-size: 14px;

            padding: 10px 0;

            min-width: 0;
        }

        input::placeholder {
            color: #999;
        }

        button {
            border: none;
            cursor: pointer;
        }

        #sendBtn {
            width: 45px;
            height: 45px;

            border-radius: 13px;

            background: linear-gradient(135deg, #8b5cf6, #4267d5);

            color: white;
            font-size: 20px;

            transition: 0.3s;
        }

        #sendBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px #7545e8;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #777;
            margin-top: 12px;
        }

        /* MOBILE RESPONSIVE */

        @media(max-width: 600px) {

            .main {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .header {
                padding: 17px;
            }

            .chat-area {
                padding: 15px;
            }

            .input-area {
                padding: 15px;
            }

            .welcome h1 {
                font-size: 23px;
            }

            .message {
                max-width: 95%;
            }
        }

    </style>

</head>

<body>

    <!-- GALAXY BACKGROUND -->

    <div class="galaxy">

        <div class="nebula one"></div>
        <div class="nebula two"></div>
        <div class="nebula three"></div>

        <canvas id="stars"></canvas>

    </div>


    <!-- MAIN CHAT -->

    <div class="main">

        <div class="chat-container">

            <!-- HEADER -->

            <div class="header">

                <div class="logo">✦</div>

                <div>
                    <h2>Galaxy AI</h2>
                    <p>Your intelligent AI assistant</p>
                </div>

                <div class="status">
                    Online
                </div>

            </div>


            <!-- CHAT MESSAGES -->

            <div class="chat-area" id="chatArea">

                <div class="welcome" id="welcome">

                    <div class="emoji">🌌</div>

                    <h1>Explore the Universe of AI</h1>

                    <p>
                        Hello! Welcome to Galaxy AI.<br>
                        Ask me anything. I'm here to help you!
                    </p>

                </div>

            </div>


            <!-- INPUT SECTION -->

            <div class="input-area">

                <div class="input-box">

                    <input
                        type="text"
                        id="message"
                        placeholder="Ask me anything..."
                        autocomplete="off"
                    >

                    <button id="sendBtn" onclick="sendMessage()">
                        ➤
                    </button>

                </div>

                <div class="footer">
                    Powered by OpenAI • Galaxy AI
                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        const chatArea = document.getElementById("chatArea");
        const input = document.getElementById("message");
        const sendBtn = document.getElementById("sendBtn");


        // ADD MESSAGE TO CHAT

        function addMessage(text, sender) {

            const message = document.createElement("div");

            message.className = "message " + sender;

            const avatar = document.createElement("div");

            avatar.className = "avatar";

            avatar.textContent = sender === "user" ? "👤" : "✦";


            const bubble = document.createElement("div");

            bubble.className = "bubble";

            // Safe text display
            bubble.textContent = text;


            message.appendChild(avatar);
            message.appendChild(bubble);

            chatArea.appendChild(message);

            chatArea.scrollTop = chatArea.scrollHeight;

        }


        // SHOW TYPING ANIMATION

        function showTyping() {

            const typing = document.createElement("div");

            typing.className = "message bot";
            typing.id = "typing";

            typing.innerHTML = `
                <div class="avatar">✦</div>

                <div class="bubble">
                    <div class="typing">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;

            chatArea.appendChild(typing);

            chatArea.scrollTop = chatArea.scrollHeight;

        }


        // REMOVE TYPING ANIMATION

        function removeTyping() {

            const typing = document.getElementById("typing");

            if (typing) {
                typing.remove();
            }

        }


        // SEND MESSAGE TO BACKEND

        async function sendMessage() {

            let userMessage = input.value.trim();

            if (userMessage === "") {
                return;
            }

            // Remove welcome screen
            const welcome = document.getElementById("welcome");

            if (welcome) {
                welcome.remove();
            }

            // Show user message
            addMessage(userMessage, "user");

            input.value = "";

            sendBtn.disabled = true;

            showTyping();


            try {

                let response = await fetch(
                    "http://localhost:8080/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            message: userMessage
                        })
                    }
                );


                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }


                let data = await response.json();

                removeTyping();


                if (data.reply) {

                    addMessage(data.reply, "bot");

                } else {

                    addMessage("Sorry, I couldn't understand the response.", "bot");

                }

            }

            catch (error) {

                removeTyping();

                console.error(error);

                addMessage(
                    "Unable to connect to the AI server. Please check whether your backend is running.",
                    "bot"
                );

            }

            finally {

                sendBtn.disabled = false;

                input.focus();

            }

        }


        // PRESS ENTER TO SEND

        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });


        // ANIMATED GALAXY STARS

        const canvas = document.getElementById("stars");

        const ctx = canvas.getContext("2d");

        let stars = [];

        function resizeCanvas() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            stars = [];

            for (let i = 0; i < 180; i++) {

                stars.push({

                    x: Math.random() * canvas.width,

                    y: Math.random() * canvas.height,

                    size: Math.random() * 1.8,

                    speed: Math.random() * 0.4 + 0.1,

                    opacity: Math.random()

                });

            }

        }


        function animateStars() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {

                star.y += star.speed;

                if (star.y > canvas.height) {

                    star.y = 0;

                    star.x = Math.random() * canvas.width;

                }

                star.opacity += (Math.random() - 0.5) * 0.05;

                star.opacity = Math.max(
                    0.2,
                    Math.min(1, star.opacity)
                );

                ctx.beginPath();

                ctx.arc(
                    star.x,
                    star.y,
                    star.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(255,255,255,${star.opacity})`;

                ctx.shadowBlur = 8;

                ctx.shadowColor = "#a78bfa";

                ctx.fill();

            });

            requestAnimationFrame(animateStars);

        }


        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();

        animateStars();

    </script>

</body>

</html>
